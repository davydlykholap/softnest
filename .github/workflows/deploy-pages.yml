name: Deploy SoftNest to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-content-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit website dependencies
        run: npm audit --audit-level=moderate

      - name: Validate and build static export
        run: npm run check
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          CONTENT_SOURCE: sanity
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}
          NEXT_PUBLIC_GOOGLE_ADS_QUOTE_CONVERSION: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_QUOTE_CONVERSION }}
          NEXT_PUBLIC_GOOGLE_ADS_PHONE_CONVERSION: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_PHONE_CONVERSION }}
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload generated website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Record publishing outcome
        if: always()
        run: |
          echo "## SoftNest publishing" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: https://softnestcare.ca" >> "$GITHUB_STEP_SUMMARY"
          echo "A failed build does not replace the currently published website." >> "$GITHUB_STEP_SUMMARY"
