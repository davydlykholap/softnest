name: Validate website and editor
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - run: npm ci
      - run: npm ci --prefix studio
      - run: npm audit --audit-level=moderate
      - run: npm audit --audit-level=moderate --prefix studio
      - run: npm run content:types
      - run: npm run studio:check
      - run: npm run check
        env:
          CONTENT_SOURCE: sanity
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
