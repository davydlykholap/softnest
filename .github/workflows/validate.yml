name: Validate website and editor
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@11.14.1

      - run: npm ci
      - run: npm ci --prefix studio
      - name: Audit dependencies
        run: npm run audit:dependencies
      - run: npm run content:types
      - run: npm run studio:check
      - run: npm run check
        env:
          CONTENT_SOURCE: sanity
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke and accessibility checks
        run: npm run test:e2e:built
