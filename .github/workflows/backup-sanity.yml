name: Back up Sanity production content

on:
  schedule:
    - cron: "11 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@11.14.1

      - run: npm ci --prefix studio
      - name: Export production dataset and assets
        shell: bash
        run: |
          mkdir -p backups
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          cd studio
          npx sanity dataset export prod "../backups/softnest-sanity-prod-${stamp}.tar.gz" \
            -p u0x0al83 --overwrite
      - name: Upload restorable backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanity-production-backup
          path: backups/*.tar.gz
          if-no-files-found: error
          retention-days: 30
